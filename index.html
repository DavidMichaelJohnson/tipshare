<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Out — Distribution Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap');

  :root{
    /* ---- ledger app palette (unchanged from original) ---- */
    --ink:#1c1a17;
    --paper:#efe9dd;
    --paper-dim:#e2dac9;
    --brass:#a9762c;
    --brass-bright:#c98e3c;
    --line: rgba(28,26,23,0.18);
    --red:#8c3a2b;

    /* ---- splash-only palette ---- */
    --splash-ink:#160e0a;
    --splash-bar-black:#1b120c;
    --splash-copper:#b8763f;
    --splash-copper-bright:#e0a862;
    --splash-cream:#f4e8d8;
    --splash-wine:#c23a48;
    --splash-paper:#efe3cd;
    --splash-paper-shadow:#00000055;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    padding:48px 20px;
    display:flex;
    justify-content:center;
  }

  .ledger{
    width:100%;
    max-width:640px;
    background:
      linear-gradient(var(--paper), var(--paper));
    position:relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .ledger::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--brass) 0 14px, transparent 14px 20px);
    opacity:0.7;
  }

  header{
    padding:40px 40px 24px;
    border-bottom: 2px solid var(--ink);
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:10px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:40px;
    margin:0 0 8px;
    line-height:1.05;
  }

  .sub{
    font-size:13px;
    color:rgba(28,26,23,0.65);
    max-width:46ch;
    line-height:1.5;
  }

  .pool-block{
    padding:24px 40px;
    border-bottom: 1px dashed var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }

  .pool-label{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .pool-input-wrap{
    display:flex;
    align-items:baseline;
    gap:6px;
  }

  .pool-input-wrap span{
    font-size:20px;
    color:var(--brass);
    font-weight:700;
  }

  #poolTotal{
    font-family:'Space Mono', monospace;
    font-size:24px;
    font-weight:700;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--ink);
    width:150px;
    text-align:right;
    padding:2px 0;
    color:var(--ink);
  }
  #poolTotal:focus{ outline:none; border-bottom-color:var(--brass); }

  .rows{
    padding:8px 40px 4px;
  }

  .col-heads{
    display:grid;
    grid-template-columns: 1fr 92px 110px 32px;
    gap:12px;
    padding:14px 0 8px;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(28,26,23,0.5);
    border-bottom:1px solid var(--line);
  }
  .col-heads .num{ text-align:right; }

  .row{
    display:grid;
    grid-template-columns: 1fr 92px 110px 32px;
    gap:12px;
    align-items:center;
    padding:12px 0;
    border-bottom: 1px solid var(--line);
  }

  .row input[type="text"], .row input[type="number"]{
    font-family:'Space Mono', monospace;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:2px;
    padding:8px 10px;
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  .row input[type="number"]{ text-align:right; }
  .row input:focus{ outline:none; border-color:var(--brass); background:#fff; }

  .share-out{
    text-align:right;
    font-weight:700;
    font-size:15px;
    color:var(--red);
    white-space:nowrap;
  }

  .remove-btn{
    background:none;
    border:none;
    color:rgba(28,26,23,0.35);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:4px;
    transition:color 0.15s;
  }
  .remove-btn:hover{ color:var(--red); }

  .add-row{
    margin:16px 0 8px;
    background:none;
    border:1.5px dashed var(--brass);
    color:var(--brass);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:10px 16px;
    border-radius:3px;
    cursor:pointer;
    width:100%;
    transition: all 0.15s;
  }
  .add-row:hover{ background:var(--brass); color:var(--paper); }

  .summary{
    margin:12px 40px 0;
    padding:18px 0 4px;
    border-top:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:rgba(28,26,23,0.6);
  }

  .summary strong{
    color:var(--ink);
    font-size:13px;
  }

  .warning{
    margin:0 40px;
    padding:10px 14px;
    background: rgba(140,58,43,0.1);
    border:1px solid var(--red);
    color:var(--red);
    font-size:12px;
    border-radius:3px;
    display:none;
  }
  .warning.show{ display:block; }

  footer{
    padding:28px 40px 36px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }

  .stamp{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:12px;
    color:rgba(28,26,23,0.4);
  }

  @media (max-width:480px){
    header{ padding:32px 24px 20px; }
    h1{ font-size:30px; }
    .pool-block, .rows, .summary, footer{ padding-left:24px; padding-right:24px; }
    .col-heads, .row{ grid-template-columns: 1fr 70px 90px 24px; gap:8px; }
    .row input{ font-size:13px; padding:7px 8px; }
  }

  /* ============================================================
     SPLASH SCREEN (shown on load, dismisses to reveal the ledger)
     ============================================================ */

  #splashOverlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:24px;
    background:
      radial-gradient(ellipse at 50% 0%, #3a2413 0%, var(--splash-bar-black) 55%, #0e0906 100%);
    font-family:'Karla',sans-serif;
    transition: opacity 0.55s ease, visibility 0.55s ease;
  }
  #splashOverlay.dismissed{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .splash{
    position:relative;
    width:min(88vw, 420px);
    aspect-ratio:800/1066;
    border-radius:18px;
    box-shadow:
      0 0 0 2px rgba(224,168,98,0.35),
      0 30px 60px -20px rgba(0,0,0,0.8),
      0 0 80px -10px rgba(184,118,63,0.25);
    background:#000;
  }

  .photo-frame{
    position:absolute;
    inset:0;
    border-radius:18px;
    overflow:hidden;
  }

  .portrait{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 18%;
    display:block;
  }

  .wash{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(20,12,6,0) 55%, rgba(15,9,5,0.92) 100%),
      radial-gradient(ellipse at 50% 0%, rgba(20,12,6,0) 40%, rgba(10,6,3,0.35) 100%);
    pointer-events:none;
  }

  .bubble-wrap{
    position:absolute;
    left:6%;
    right:6%;
    bottom:6%;
    display:flex;
    justify-content:center;
  }

  .bubble{
    position:relative;
    max-width:100%;
    background:var(--splash-paper);
    color:var(--splash-ink);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:clamp(13px, 3.6vw, 17px);
    line-height:1.28;
    letter-spacing:0.2px;
    padding:14px 16px 16px;
    border-radius:3px;
    box-shadow:
      0 10px 0 -4px var(--splash-paper-shadow),
      0 14px 24px rgba(0,0,0,0.55);
    transform:rotate(-1.1deg);
    animation:wiggle 3.4s ease-in-out infinite;
    clip-path:polygon(
      1% 4%, 12% 0%, 27% 2%, 41% 0%, 58% 2%, 73% 0%, 88% 2%, 99% 0%,
      100% 18%, 98% 34%, 100% 50%, 97% 68%, 100% 84%, 98% 96%, 88% 100%,
      70% 98%, 55% 100%, 40% 98%, 24% 100%, 9% 98%, 0% 88%, 2% 70%,
      0% 52%, 2% 36%, 0% 20%
    );
  }

  .bubble::before{
    content:"";
    position:absolute;
    left:18%;
    bottom:-11px;
    width:22px;
    height:22px;
    background:var(--splash-paper);
    clip-path:polygon(0 0, 100% 0, 0 100%);
    transform:rotate(-6deg);
  }

  @keyframes wiggle{
    0%,100%{ transform:rotate(-1.1deg); }
    50%{ transform:rotate(0.9deg); }
  }

  .bubble .cursor-word{ opacity:0; }
  .bubble .cursor-word.shown{ opacity:1; }
  .bubble .cursor-word{ transition:opacity .04s linear; }

  .replay{
    position:absolute;
    top:4%;
    right:5%;
    font-family:'Karla',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--splash-cream);
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(224,168,98,0.5);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    backdrop-filter:blur(2px);
    transition:background .2s ease;
  }
  .replay:hover{ background:rgba(0,0,0,0.55); }

  .enter-btn{
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--splash-cream);
    background:none;
    border:1.5px dashed var(--brass-bright);
    padding:12px 22px;
    border-radius:3px;
    cursor:pointer;
    opacity:0;
    transform:translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.15s ease, color 0.15s ease;
    pointer-events:none;
  }
  .enter-btn.ready{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .enter-btn:hover{ background:var(--brass-bright); color:var(--splash-ink); }

  @media (prefers-reduced-motion: reduce){
    .bubble{ animation:none; }
    .enter-btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="ledger">
  <header>
    <div class="eyebrow">Close-out · Tip Pool</div>
    <h1>Tip Out</h1>
    <div class="sub">Split the pool by hours on the clock. Add every name on shift, log their hours, and the ledger settles the rest.</div>
  </header>

  <div class="pool-block">
    <div class="pool-label">Total Pool</div>
    <div class="pool-input-wrap">
      <span>$</span>
      <input type="number" id="poolTotal" value="0.00" min="0" step="0.01" inputmode="decimal">
    </div>
  </div>

  <div class="rows">
    <div class="col-heads">
      <div>Employee</div>
      <div class="num">Hours</div>
      <div class="num">Share</div>
      <div></div>
    </div>
    <div id="rowContainer"></div>
  </div>

  <button class="add-row" id="addRowBtn">+ Add employee</button>

  <div class="warning" id="warningBox"></div>

  <div class="summary">
    <div>Total hours logged: <strong id="sumHours">0</strong></div>
    <div>Distributed: <strong id="sumDistributed">$0.00</strong></div>
  </div>

  <footer>
    <div class="stamp">per-hour rate: <span id="perHourRate">$0.00</span>/hr</div>
    <div class="stamp" id="dateStamp"></div>
  </footer>
</div>

<script>
  const rowContainer = document.getElementById('rowContainer');
  const poolTotalInput = document.getElementById('poolTotal');
  const addRowBtn = document.getElementById('addRowBtn');
  const sumHoursEl = document.getElementById('sumHours');
  const sumDistributedEl = document.getElementById('sumDistributed');
  const perHourRateEl = document.getElementById('perHourRate');
  const warningBox = document.getElementById('warningBox');

  let rowId = 0;

  function fmtMoney(n){
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function createRow(name = '', hours = ''){
    rowId++;
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.id = rowId;
    row.innerHTML = `
      <input type="text" class="name-input" placeholder="Employee name" value="${name}">
      <input type="number" class="hours-input" placeholder="0.00" min="0" step="0.25" value="${hours}" inputmode="decimal">
      <div class="share-out">$0.00</div>
      <button class="remove-btn" title="Remove">&times;</button>
    `;
    row.querySelector('.name-input').addEventListener('input', recalc);
    row.querySelector('.hours-input').addEventListener('input', recalc);
    row.querySelector('.remove-btn').addEventListener('click', () => {
      row.remove();
      recalc();
    });
    rowContainer.appendChild(row);
  }

  function recalc(){
    const pool = parseFloat(poolTotalInput.value) || 0;
    const rows = Array.from(rowContainer.querySelectorAll('.row'));

    let totalHours = 0;
    const hoursList = rows.map(row => {
      const h = parseFloat(row.querySelector('.hours-input').value) || 0;
      totalHours += h;
      return h;
    });

    // Work in integer cents so rounded shares always sum to the exact pool amount.
    const poolCents = Math.round(pool * 100);
    let distributed = 0;

    if (totalHours > 0 && rows.length > 0) {
      let allocatedCents = 0;
      rows.forEach((row, i) => {
        if (i === rows.length - 1) return; // last row gets the remainder
        const shareCents = Math.round((hoursList[i] / totalHours) * poolCents);
        allocatedCents += shareCents;
        row.querySelector('.share-out').textContent = fmtMoney(shareCents / 100);
      });
      const lastCents = poolCents - allocatedCents;
      const lastRow = rows[rows.length - 1];
      lastRow.querySelector('.share-out').textContent = fmtMoney(lastCents / 100);
      distributed = poolCents / 100;
    } else {
      rows.forEach(row => {
        row.querySelector('.share-out').textContent = fmtMoney(0);
      });
    }

    sumHoursEl.textContent = totalHours.toLocaleString('en-US', {maximumFractionDigits:2});
    sumDistributedEl.textContent = fmtMoney(distributed);
    perHourRateEl.textContent = totalHours > 0 ? (pool/totalHours).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) + '/hr' : '$0.00/hr';

    if (rows.length === 0){
      warningBox.classList.remove('show');
    } else if (totalHours === 0){
      warningBox.textContent = 'Log at least one hour to distribute the pool.';
      warningBox.classList.add('show');
    } else if (pool === 0){
      warningBox.textContent = 'Enter the total pool amount to see shares.';
      warningBox.classList.add('show');
    } else {
      warningBox.classList.remove('show');
    }
  }

  addRowBtn.addEventListener('click', () => { createRow(); recalc(); });
  poolTotalInput.addEventListener('input', recalc);

  // seed with three starter rows
  createRow('', '');
  createRow('', '');
  createRow('', '');
  recalc();

  document.getElementById('dateStamp').textContent = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
</script>

<script>
(function(){
  const line = "Do you need help splitting tips at the end of the night like I do? This simple tool makes it easy!";
  const words = line.split(" ");
  const bubble = document.getElementById('bubble');
  const replayBtn = document.getElementById('replayBtn');
  const enterBtn = document.getElementById('enterBtn');
  const overlay = document.getElementById('splashOverlay');

  let dismissTimer = null;

  function buildBubble(){
    bubble.innerHTML = words.map(w => `<span class="cursor-word">${w}</span>`).join(' ');
  }

  function play(){
    if(dismissTimer) clearTimeout(dismissTimer);
    overlay.classList.remove('dismissed');
    buildBubble();
    enterBtn.classList.add('ready'); // available to skip right away
    const spans = bubble.querySelectorAll('.cursor-word');

    let i = 0;
    const perWord = 190; // ms per word reveal

    function step(){
      if(i < spans.length){
        spans[i].classList.add('shown');
        i++;
        setTimeout(step, perWord);
      } else {
        // Auto-advance to the calculator a moment after he finishes talking.
        dismissTimer = setTimeout(dismiss, 1400);
      }
    }
    step();
  }

  function dismiss(){
    if(dismissTimer) clearTimeout(dismissTimer);
    overlay.classList.add('dismissed');
  }

  replayBtn.addEventListener('click', play);
  enterBtn.addEventListener('click', dismiss);

  window.addEventListener('load', play);
})();
</script>

</body>
</html>
